# Timeout in seconds that Limine will use before automatically booting.
# basic limine config
# releases will have a custom limine conf
timeout: 5
/LnxSystem
protocol: limine
path:boot():/boot/system/lnkrnl.elf
//CMD
	comment: boots straight to the command line skipping guionboot
	protocol: limine
	cmdline: CMD
	path: boot():/boot/lnkrnl.elf
# The entry name that will be displayed in the boot menu.
//LnxOS(With Disk Support)
    comment:Boots up lnkrnl with disk support
    # We use the Limine boot protocol.
    protocol: limine

    # Path to the kernel to boot. boot():/ represents the partition on which limine.conf is located.
    path: boot():/boot/lnkrnl.elf
//safe_mode(without disksupport)
    #same stuff as before
    comment: Safe mode LNXOS without disk support
    cmdline: smD
    protocol: limine
   
    path: boot():/boot/lnkrnl.elf